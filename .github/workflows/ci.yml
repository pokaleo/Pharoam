name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (incl. architecture boundaries)
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Tests and core coverage
        run: pnpm test:coverage
      - name: Hard rules (content checks)
        run: pnpm guard
      - name: Unused files, exports and dependencies
        run: pnpm knip
      - name: API docs (every export documented)
        run: pnpm docs:api
      - name: Browsers for the end-to-end tests (Chromium, Safari's WebKit, Firefox)
        run: pnpm --filter @pharoam/web exec playwright install --with-deps chromium webkit firefox
      - name: End-to-end tests with accessibility checks (builds the app)
        run: pnpm test:e2e
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: PR title (becomes the squash commit)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  # Forks must build and run without the Pharoam brand (LICENSING.md, TRADEMARKS.md).
  build-without-brand:
    name: build-without-brand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove the brand, as a fork would
        run: rm -r brand
      - name: Build with the neutral theme
        run: pnpm build
      - name: Nothing from the brand in the build (its lamp colour or its typeface)
        run: |
          if grep -rli -e 'f2b632' -e 'figtree' dist/web; then
            echo "The build without brand/ still contains brand files or values."
            exit 1
          fi

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
