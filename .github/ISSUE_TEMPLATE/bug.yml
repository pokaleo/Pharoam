name: Bug report
description: Something doesn't work as expected
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Don't include personal data from your profile.** For security issues, use private reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. … 2. … 3. …"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and storage connector
      placeholder: "Chrome 140, macOS 26, local folder"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Attach the exported local diagnostic log if relevant. Personal content is removed on export.
