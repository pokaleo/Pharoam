name: Feature idea
description: Suggest something Pharoam could do
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: principles
    attributes:
      label: Fit with Pharoam's principles
      description: "Optional: how does it relate to the Charter's design rules (docs/CHARTER.md §3)?"
